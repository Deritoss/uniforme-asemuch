<body>
<style>
/* "A compás", versión cuaderno de croquis.
   Una sola pantalla: escena arriba (partitura + perchero), panel de altura fija, botones siempre visibles.
   Papel cuadriculado de cuaderno, tinta de lápiz pasta azul, color de lápiz corrido y destacador amarillo para lo marcado.
   Todo cae en el próximo tiempo de un vals (negra = 0,3 s). Una sola apariencia, a propósito. */
:root {
  color-scheme: light;
  --paper: #F7F8F3;
  --grid: #D9E3EE;
  --ink: #1E3A8C;
  --ink2: #13265E;
  --graphite: #5B606B;
  --margin: #E0675E;
  --hl: #FFE45C;
  --kraft: #DCC39A;
  --ok: #237A47; --okBg: #DFF1E5;
  --warn: #9A5B00; --warnBg: #FBE9C2;
  --bad: #B3261E; --badBg: #FADAD6;
  --hand: "Kalam", "Comic Neue", cursive;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --pendulum: cubic-bezier(0.45, 0, 0.55, 1);
  --sketch: 255px 14px 225px 14px / 14px 225px 14px 255px;
  --sketch2: 14px 225px 14px 255px / 255px 14px 225px 14px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink2); font-family: var(--body); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px; background-position: -1px -1px;
}
body::before { content: ""; position: fixed; top: 0; bottom: 0; left: max(8px, env(safe-area-inset-left, 0px)); width: 1.5px; background: var(--margin); opacity: .7; pointer-events: none; }
.app {
  height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto; display: grid;
  grid-template-rows: auto minmax(150px, 1fr) var(--panelH) auto;
  --panelH: clamp(272px, 45dvh, 336px);
  padding: env(safe-area-inset-top, 0px) max(18px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
h2 { font-family: var(--hand); font-weight: 700; font-size: clamp(21px, 3.5dvh, 26px); line-height: 1.08; margin: 0; color: var(--ink); text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, color 200ms ease, opacity 200ms ease; }
button:active { transform: scale(.97); }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; box-shadow: 0 0 0 5px var(--ink); }
svg { display: block; }
.ico { width: 22px; height: 22px; flex: none; }

/* Encabezado */
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 8px; min-height: 52px; }
.where { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.sound { display: inline-flex; align-items: center; gap: 6px; height: 40px; border-radius: var(--sketch); border: 2px solid var(--ink); background: #fff; padding: 0 12px 0 9px; font-size: 15px; font-weight: 700; color: var(--ink); flex: none; }
.sound[aria-pressed="false"] { color: var(--graphite); border-color: var(--graphite); background: transparent; }

/* Escena */
.scene { position: relative; min-height: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ghost { transition: opacity 220ms ease; }
.slot.on .ghost { opacity: 0; }
.gar { opacity: 0; transition: opacity 180ms ease; transform-box: fill-box; transform-origin: 50% 0%; }
.slot.on .gar { opacity: 1; }
.fill { transition: fill 320ms ease; }
.prop { opacity: 0; transform: translateY(-10px); transform-box: fill-box; transition: opacity 240ms var(--ease-out), transform 420ms cubic-bezier(0.34, 1.3, 0.64, 1); }
.prop.on { opacity: 1; transform: none; }
.rc { clip-path: inset(0 0 100% 0); transition: clip-path 600ms var(--ease-out); }
.rc.on { clip-path: inset(0 0 0 0); }
.stamp { opacity: 0; transform: scale(.5) rotate(-20deg); transform-box: fill-box; transform-origin: center; transition: opacity 140ms ease, transform 260ms cubic-bezier(0.34, 1.4, 0.64, 1); }
.stamp.on { opacity: 1; transform: none; }
#vt { opacity: 0; transition: opacity 180ms ease; }
#vt.on { opacity: 1; }
#vtag { transform-box: fill-box; transform-origin: 50% 0%; transform: rotate(5deg); }
@keyframes drop { 0% { opacity: 0; transform: translateY(-12px) rotate(-14deg); animation-timing-function: var(--ease-out); } 45% { opacity: 1; transform: translateY(0) rotate(11deg); animation-timing-function: var(--pendulum); } 75% { transform: rotate(3deg); animation-timing-function: var(--pendulum); } 100% { transform: rotate(5deg); } }
@keyframes sway { 0% { transform: rotate(-6deg); animation-timing-function: var(--pendulum); } 45% { transform: rotate(10deg); animation-timing-function: var(--pendulum); } 75% { transform: rotate(3.5deg); animation-timing-function: var(--pendulum); } 100% { transform: rotate(5deg); } }
#vtag.drop { animation: drop 560ms both; }
#vtag.sway { animation: sway 460ms both; }
.note { transition: opacity 300ms ease; }
.note.dim { opacity: .22; }
.nh { transform-box: fill-box; transform-origin: center; }
@keyframes noteIn { from { opacity: 0; transform: translateY(4px) scale(.6); } }
.note.new .nh { animation: noteIn 300ms cubic-bezier(0.34, 1.4, 0.64, 1) both; }
#hl { clip-path: inset(0 100% 0 0); transition: clip-path 200ms ease; }
#hl.on { clip-path: inset(0 0 0 0); transition: clip-path 1800ms linear; }

/* Panel de altura fija: cada paso cabe aquí */
.panel { position: relative; min-height: 0; overflow: hidden; border-top: 2px solid var(--ink); }
.panel::before { content: ""; position: absolute; top: -2px; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(90deg, transparent 0 7px, var(--paper) 7px 9px); }
.pv { position: absolute; inset: 0; padding: 12px 0 8px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: thin; }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.more { flex: none; border: 0; background: none; padding: 0 2px; min-height: 40px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.lead { color: var(--graphite); font-size: 16px; }
.beat { animation: rise 300ms var(--ease-out) both; animation-delay: calc(var(--d, 0s) + var(--k, 0) * 300ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.opt { width: 100%; text-align: left; border: 2px solid var(--ink); border-radius: var(--sketch); background: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 3px 3px 0 var(--ink); transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out), background-color 200ms ease; }
.opt:nth-of-type(2n) { border-radius: var(--sketch2); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.opt[aria-pressed="true"] { background: var(--hl); }
.opt .art { width: 46px; height: 46px; display: grid; place-items: center; flex: none; color: var(--ink); }
.opt .art .ico { width: 34px; height: 34px; }
.opt b { display: block; font-size: 18px; line-height: 1.15; color: var(--ink2); }
.opt small { font-size: 14px; color: var(--graphite); }
.list { display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.li .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 2px solid var(--ink); }
.li b { font-weight: 700; }
.li span.s { color: var(--graphite); font-size: 14px; display: block; }
.note-box { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; padding: 9px 12px; border-radius: var(--sketch2); background: rgba(255, 228, 92, .45); }
.note-box .ico { color: var(--ink); margin-top: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { min-height: 50px; border-radius: var(--sketch); border: 2px solid var(--ink); background: #fff; font-weight: 700; color: var(--ink2); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 2px 2px 0 var(--ink); }
.big:nth-child(2) { border-radius: var(--sketch2); }
.big[aria-pressed="true"] { background: var(--hl); }
.q { font-weight: 700; }
.res { border-left: 4px solid var(--graphite); padding: 8px 12px; display: flex; align-items: flex-start; gap: 8px; font-size: 16px; background: rgba(255,255,255,.75); transition: background-color 240ms ease, border-color 240ms ease; }
.res .ico { margin-top: 1px; }
.res.ok { border-color: var(--ok); background: var(--okBg); } .res.ok .ico { color: var(--ok); }
.res.warn { border-color: var(--warn); background: var(--warnBg); } .res.warn .ico { color: var(--warn); }
.res.bad { border-color: var(--bad); background: var(--badBg); } .res.bad .ico { color: var(--bad); }
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chip { border: 2px solid var(--ink); background: #fff; border-radius: var(--sketch); min-height: 42px; padding: 0 4px; font-weight: 700; font-size: 15px; color: var(--ink2); }
.chip:nth-child(2n) { border-radius: var(--sketch2); }
.chip[aria-pressed="true"] { background: var(--hl); box-shadow: 2px 2px 0 var(--ink); }
.dots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px 4px; }
.dt { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; padding: 2px 0; color: var(--ink2); min-height: 44px; }
.dt:active { transform: none; }
.dt .c { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); transition: transform 220ms var(--ease-out), box-shadow 200ms ease; }
.dt:active .c { transform: scale(.88); }
.dt[aria-pressed="true"] { font-weight: 700; }
.dt[aria-pressed="true"] .c { transform: scale(1.1); box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--hl), 0 0 0 7.5px var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; border: 2px solid var(--ink); border-radius: var(--sketch); background: #fff; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; line-height: 1.1; text-align: center; min-height: 72px; color: var(--ink2); }
.tile:nth-child(2n) { border-radius: var(--sketch2); }
.tile .ico { width: 26px; height: 26px; color: var(--ink); }
.tile[aria-pressed="true"] { background: var(--badBg); border-color: var(--bad); }
.tile[aria-pressed="true"]::after { content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 2.5px; background: var(--bad); transform: rotate(-24deg); border-radius: 2px; }
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; line-height: 1.25; }
.st .n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 18px; color: var(--ink); flex: none; background: #fff; }
.st b { display: block; font-size: 15.5px; }
.st span.s { color: var(--graphite); }
.checks { display: flex; flex-direction: column; gap: 5px; }
.ck { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 4px; cursor: pointer; font-size: 16px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border-radius: 10px; transition: background-color 200ms ease; }
.ck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck .box { width: 30px; height: 30px; border-radius: 7px 9px 6px 10px; border: 2.5px solid var(--ink); display: grid; place-items: center; color: var(--ink); flex: none; background: #fff; transition: transform 140ms var(--ease-out), background-color 200ms ease; }
.ck:active .box { transform: scale(.9); }
.ck .box .ico { width: 26px; height: 26px; }
.ck .box .ico path { stroke-width: 3; stroke-dasharray: 21; stroke-dashoffset: 21; transition: stroke-dashoffset 120ms ease; }
.ck:has(input:checked) .box { background: var(--hl); }
.ck:has(input:checked) .box .ico path { stroke-dashoffset: 0; transition: stroke-dashoffset 240ms var(--ease-out) 40ms; }
.ck:has(input:checked) .t { text-decoration: line-through; text-decoration-color: rgba(30, 58, 140, .45); text-decoration-thickness: 2px; color: var(--graphite); }
.ck:has(input:focus-visible) { outline: 3px solid var(--hl); outline-offset: 1px; }

/* Botones de abajo */
.nav { display: flex; gap: 10px; padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px)); }
.nb { min-height: 54px; border-radius: var(--sketch2); border: 2px solid var(--ink); background: #fff; padding: 0 14px; font-weight: 700; font-size: 17px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.nb.primary { flex: 1; border-radius: var(--sketch); background: var(--ink); color: #fff; box-shadow: 3px 3px 0 var(--hl), 3px 3px 0 1.5px var(--ink); }
.nb.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--hl), 1px 1px 0 1.5px var(--ink); }
.nb .ico { transition: transform 200ms var(--ease-out); }
.nb:disabled { opacity: .35; cursor: default; box-shadow: none; }
.nb:disabled:active { transform: none; }

/* Hoja de detalle */
.scrim { position: fixed; inset: 0; background: rgba(19, 38, 94, .45); z-index: 20; opacity: 0; transition: opacity 200ms ease; }
.scrim[data-open] { opacity: 1; transition-duration: 300ms; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; justify-content: center; pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 580px; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; background: #fff; border-radius: 24px 24px 0 0; padding: 0 max(22px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; font-size: 17px; box-shadow: 0 -12px 40px rgba(19, 38, 94, .25); border-top: 3px solid var(--ink); transform: translateY(100%); transition: transform 420ms var(--ease-drawer); }
.sheet[data-open] .sheet-in { transform: translateY(0); }
.sheet[data-closing] .sheet-in { transition-duration: 240ms; }
.sheet-hd { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.sheet-in ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.sheet-in li::marker { color: var(--ink); }
.grab { width: 44px; height: 5px; border-radius: 5px; background: #CBD5E3; align-self: center; }
.src { font-size: 14px; color: var(--graphite); border-top: 1.5px dashed #CBD5E3; padding-top: 10px; }

/* Teléfonos bajos: todo un poco más compacto para que el paso quepa sin desplazar */
@media (max-height: 700px) {
  .app { --panelH: clamp(272px, 49dvh, 336px); }
  .hdr { min-height: 46px; padding-top: 4px; }
  .pv { gap: 7px; padding-top: 9px; }
  .opt { padding: 8px 12px; } .opt .art { width: 36px; height: 36px; } .opt .art .ico { width: 28px; height: 28px; } .opt b { font-size: 16.5px; }
  .ck { min-height: 38px; font-size: 15.5px; } .ck .box { width: 27px; height: 27px; } .checks { gap: 2px; }
  .tile { min-height: 60px; font-size: 12px; padding-top: 6px; } .tile .ico { width: 23px; height: 23px; }
  .dt .c { width: 30px; height: 30px; } .dt { min-height: 40px; font-size: 12px; }
  .chip, .big { min-height: 40px; } .note-box { font-size: 14px; padding: 6px 10px; }
  .li { font-size: 15px; } .li .sw { width: 22px; height: 22px; } .lead { font-size: 15px; }
  .res { font-size: 15px; padding: 6px 10px; } .st { font-size: 13.5px; } .st b { font-size: 14.5px; }
  .nb { min-height: 50px; } .more { min-height: 36px; }
}
@media (hover: hover) and (pointer: fine) {
  .opt:hover:not([aria-pressed="true"]), .big:hover:not([aria-pressed="true"]), .chip:hover:not([aria-pressed="true"]), .tile:hover:not([aria-pressed="true"]) { background: rgba(255, 228, 92, .35); }
  .dt:hover:not([aria-pressed="true"]) .c { transform: scale(1.06); }
  .nb.primary:not(:disabled):hover .ico { transform: translateX(3px); }
  .ck:hover { background: rgba(255, 255, 255, .7); }
}
@media (prefers-reduced-motion: reduce) {
  @keyframes rise { from { opacity: 0; } }
  @keyframes noteIn { from { opacity: 0; } }
  @keyframes drop { from { opacity: 0; transform: rotate(5deg); } to { opacity: 1; transform: rotate(5deg); } }
  @keyframes sway { from { opacity: .4; transform: rotate(5deg); } to { opacity: 1; transform: rotate(5deg); } }
  .prop { transform: none; }
  .rc { clip-path: none; opacity: 0; transition: opacity 300ms ease; } .rc.on { opacity: 1; }
  #hl, #hl.on { clip-path: none; transition: opacity 400ms ease; } #hl { opacity: 0; } #hl.on { opacity: 1; }
  button:active, .opt:active, .nb.primary:active, .dt:active .c, .ck:active .box { transform: none; }
  .dt[aria-pressed="true"] .c { transform: none; }
  .sheet-in { transform: none; opacity: 0; transition: opacity 200ms ease; }
  .sheet[data-open] .sheet-in { transform: none; opacity: 1; }
}
</style>

<div class="app">
  <div class="hdr"><span class="hwrap"><a class="homebtn" href="./" aria-label="Volver a la portada"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 10.5L12 4l8.25 6.5M5.75 9v10.25h4.5v-5.5h3.5v5.5h4.5V9"/></svg></a><span class="where" id="where">Paso 1 de 7: tu categoría</span></span><button type="button" class="sound" id="sound" aria-pressed="true"></button></div>
  <div class="scene">

      <defs><clipPath id="half"><rect x="62" y="-20" width="70" height="150"/></clipPath></defs>

      <g id="staff"></g>
