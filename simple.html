<body>
<style>
/* Formato "historias": una tarjeta a pantalla completa por paso, como los estados de WhatsApp.
   Cada tarjeta tiene su color. La tarjeta sigue el dedo al deslizar; basta un gesto rápido para pasar.
   Una sola apariencia, a propósito: cada tarjeta fija su fondo y su texto. */
:root {
  color-scheme: light;
  --navy: #1D3A8A;
  --ink: #12224A;
  --sun: #FFE08A;
  --sky: #CFE3F7;
  --mint: #D5EFE2;
  --blush: #FBE0DE;
  --white: #FFFFFF;
  --ok: #17703F; --warn: #8A4E00; --bad: #A3241C;
  --font: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --bg: var(--navy); --fg: #FFFFFF;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 18px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; transition: background-color 360ms ease, color 360ms ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  overflow: hidden;
}
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
button {
  font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 140ms var(--ease-out), background-color 200ms ease, box-shadow 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
}
button:active { transform: scale(.97); }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
svg { display: block; }
.ico { width: 24px; height: 24px; flex: none; }
h1 { font-weight: 800; font-size: clamp(2rem, 8.6vw, 2.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }

/* Barra de avance tipo historias */
.top { padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.segs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.segs span { height: 5px; border-radius: 5px; position: relative; overflow: hidden; }
.segs span::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .25; }
.segs i { position: absolute; inset: 0; background: currentColor; border-radius: 5px; transform: scaleX(0); transform-origin: left center; transition: transform 320ms var(--ease-out); }
.segs span.on i { transform: scaleX(1); }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sound { display: inline-flex; align-items: center; gap: 6px; height: 42px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; padding: 0 14px 0 10px; font-size: 15px; font-weight: 500; }
.sound[aria-pressed="false"] { opacity: .7; }

/* Tarjeta */
.stage { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 0 12px; scrollbar-width: none; touch-action: pan-y; }
.stage::-webkit-scrollbar { display: none; }
.card { min-height: 100%; display: flex; flex-direction: column; gap: 18px; }
@keyframes cardIn { from { opacity: 0; transform: translateX(var(--from, 32px)); } }
.card.in { animation: cardIn 300ms var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.95); } }
.pop { animation: rise 360ms var(--ease-out) both; }
.card.still .pop { animation: none; }
.lead { font-size: 19px; opacity: .9; }
.more { align-self: flex-start; border: 0; background: none; padding: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.more:active { transform: scale(.98); }

/* Piezas */
.opt { width: 100%; text-align: left; border: 0; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 16px; background: #FFFFFF; color: var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,.2); transition: transform 120ms var(--ease-out), box-shadow 160ms var(--ease-out); }
.opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.opt .ic-wrap { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; flex: none; }
.opt .ic-wrap .ico { width: 34px; height: 34px; }
.opt b { display: block; font-size: 21px; line-height: 1.15; }
.opt span.s { font-size: 15px; opacity: .75; }
.opt[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--sun), 0 6px 0 rgba(0,0,0,.2); }
.opt[aria-pressed="true"]:active { box-shadow: 0 0 0 4px var(--sun), 0 2px 0 rgba(0,0,0,.2); }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.big-g { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-weight: 600; font-size: 16px; width: 140px; }
.big-g .g { width: 120px; height: 120px; filter: drop-shadow(0 6px 6px rgba(18, 34, 74, .14)); }
.badge { font-weight: 800; font-size: 15px; background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 16px; background: rgba(255,255,255,.65); }
.colorline { display: flex; flex-direction: column; gap: 10px; }
.cl { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.7); border-radius: 18px; padding: 12px 14px; font-size: 17px; }
.cl .sw { width: 44px; height: 44px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.08); box-shadow: 0 0 0 3px rgba(255,255,255,.9); }
.cl .mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }

/* Probador */
.try { display: flex; flex-direction: column; gap: 14px; }
.tstage { position: relative; height: 200px; border-radius: 26px; background: #F1F4F9; display: grid; place-items: center; overflow: hidden; background-image: radial-gradient(90% 60% at 50% 100%, #E3E9F2 0, transparent 70%); }
.tstage .g { width: 170px; height: 170px; filter: drop-shadow(0 8px 8px rgba(18, 34, 74, .14)); }
.verdict { border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 17px; color: #fff; transition: background-color 240ms ease; }
.verdict.ok { background: var(--ok); } .verdict.warn { background: var(--warn); } .verdict.bad { background: var(--bad); }
.verdict b { font-size: 19px; }
.gchips { display: flex; flex-wrap: wrap; gap: 8px; }
.gc { border: 2px solid #C9D3E3; background: #fff; border-radius: 999px; min-height: 44px; padding: 0 16px; font-weight: 600; font-size: 16px; color: var(--ink); }
.gc[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.dots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 6px; }
.dt { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--ink); padding: 0; }
.dt:active { transform: none; }
.dt .c { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(0,0,0,.1); transition: transform 220ms var(--ease-out), box-shadow 200ms ease; }
.dt:active .c { transform: scale(.9); }
.dt[aria-pressed="true"] { font-weight: 700; }
.dt[aria-pressed="true"] .c { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.dye { transition: fill 320ms ease; }
.det { transition: stroke 320ms ease; }

/* No paga */
.nog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ni { position: relative; border: 0; background: #fff; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 600; font-size: 16px; line-height: 1.15; color: var(--ink); min-height: 70px; box-shadow: 0 2px 0 rgba(163, 36, 28, .12); }
.ni .ico { width: 32px; height: 32px; }
.ni .ban { position: absolute; top: 8px; left: 34px; width: 20px; height: 20px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
.ni .ban .ico { width: 12px; height: 12px; }

/* Rendición */
.steps4 { display: flex; flex-direction: column; gap: 10px; }
.s4 { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.75); border-radius: 18px; padding: 14px; }
.s4 .n { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
.s4 b { display: block; font-size: 18px; }
.s4 span { font-size: 15px; opacity: .8; }

/* Lista final: el visto se dibuja; desmarcar es más rápido que marcar */
.ck { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); border-radius: 18px; padding: 14px; cursor: pointer; font-size: 17px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
.ck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck .box { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid rgba(255,255,255,.7); display: grid; place-items: center; color: #fff; flex: none; transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease; }
.ck:active .box { transform: scale(.9); }
.ck .box .ico path { stroke-width: 2.6; stroke-dasharray: 21; stroke-dashoffset: 21; transition: stroke-dashoffset 120ms ease; }
.ck:has(input:checked) { background: rgba(255,255,255,.95); color: var(--ink); border-color: #fff; }
.ck:has(input:checked) .box { background: var(--ok); border-color: var(--ok); }
.ck:has(input:checked) .box .ico path { stroke-dashoffset: 0; transition: stroke-dashoffset 240ms var(--ease-out) 40ms; }
.ck:has(input:focus-visible) { outline: 3px solid var(--sun); outline-offset: 2px; }
.party { border-radius: 22px; background: var(--sun); color: var(--ink); padding: 18px; display: flex; align-items: center; gap: 14px; }
.party .ico { width: 40px; height: 40px; color: var(--ok); }
.party b { font-size: 22px; display: block; }

/* Navegación inferior */
.nav { display: flex; gap: 10px; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
.nb { min-height: 60px; border-radius: 18px; border: 2px solid currentColor; background: transparent; padding: 0 18px; font-weight: 600; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.nb.primary { flex: 1; border: 0; }
.nb .ico { transition: transform 200ms var(--ease-out); }
.dark .nb.primary { background: #FFFFFF; color: var(--navy); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.light .nb.primary { background: var(--ink); color: #FFFFFF; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.nb:disabled { opacity: .35; cursor: default; box-shadow: none; }
.nb:disabled:active { transform: none; }

/* Hoja de detalle: entra con curva de cajón; sale más rápido; se puede bajar con el dedo */
.scrim { position: fixed; inset: 0; background: rgba(18, 34, 74, .5); z-index: 20; opacity: 0; transition: opacity 200ms ease; }
.scrim[data-open] { opacity: 1; transition-duration: 300ms; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; justify-content: center; pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 560px; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; background: #FFFFFF; color: var(--ink); border-radius: 28px 28px 0 0; padding: 0 max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; font-size: 17px; box-shadow: 0 -12px 40px rgba(18, 34, 74, .25); transform: translateY(100%); transition: transform 420ms var(--ease-drawer); }
.sheet[data-open] .sheet-in { transform: translateY(0); }
.sheet[data-closing] .sheet-in { transition-duration: 240ms; }
.sheet-hd { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.sheet-hd:active { cursor: grabbing; }
.sheet-in h2 { margin: 0; font-size: 24px; font-weight: 800; }
.sheet-in ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.grab { width: 44px; height: 5px; border-radius: 5px; background: #D0D7E2; align-self: center; }
.src { font-size: 14px; opacity: .7; border-top: 1px solid #E3E8EF; padding-top: 10px; }
.sheet-in .nb { background: var(--ink); color: #fff; border: 0; }

@media (hover: hover) and (pointer: fine) {
  .gc:hover:not([aria-pressed="true"]) { border-color: var(--ink); }
  .more:hover { opacity: .75; }
  .nb:not(:disabled):not(.primary):hover { background: rgba(127, 127, 127, .12); }
  .nb.primary:not(:disabled):hover .ico { transform: translateX(3px); }
  .opt:hover:not([aria-pressed="true"]) { box-shadow: 0 0 0 3px rgba(255, 224, 138, .6), 0 6px 0 rgba(0,0,0,.2); }
  .dt:hover:not([aria-pressed="true"]) .c { transform: scale(1.05); }
  .ck:hover:not(:has(input:checked)) { border-color: rgba(255,255,255,.7); }
}

@media (prefers-reduced-motion: reduce) {
  @keyframes cardIn { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; } }
  button:active, .opt:active, .dt:active .c, .ck:active .box { transform: none; }
  .dt[aria-pressed="true"] .c { transform: none; }
  .segs i { transition: none; }
  .sheet-in { transform: none; opacity: 0; transition: opacity 200ms ease; }
  .sheet[data-open] .sheet-in { transform: none; opacity: 1; }
}
</style>

<div class="app dark" id="app">
  <div class="top">
    <div class="segs" id="segs" aria-hidden="true"></div>

</div>

    <p class="src" id="sh-s"></p>
    <button type="button" class="nb" id="sh-x">Entendido</button>
  </div>
</div>

      s.map(function (x, i) { return '<div class="s4 pop" style="animation-delay:' + D5[i] + 'ms"><span class="n">' + (i + 1) + "</span><span><b>" + x[0] + "</b><span>" + x[1] + "</span></span></div>"; }).join("") + "</div>" + more("rendicion");
  }
  var CHECKS = [["obl", "Compré las prendas obligatorias"], ["azul", "Lo que más se ve es azul, celeste o azul marino"], ["marcas", "Sin marcas ni estampados grandes"], ["nada", "Nada deportivo, de fiesta ni EPP"], ["boleta", "Pedí boleta con el detalle"]];
  function countChecks() { return CHECKS.filter(function (x) { return state.checks[x[0]]; }).length; }
  var PARTY = '<div class="party">' + ic("party") + "<span><b>¡Listo para pagar!</b>Guarda la boleta para la rendición.</span></div>";
  function c6() {
    return "<h1>Antes de pagar en la caja</h1><p class=\"lead\">Marca cada punto.</p>" +
      CHECKS.map(function (x) { return '<label class="ck" for="k-' + x[0] + '"><input type="checkbox" id="k-' + x[0] + '" data-k="' + x[0] + '"' + (state.checks[x[0]] ? " checked" : "") + '><span class="box">' + ic("check") + "</span><span>" + x[1] + "</span></label>"; }).join("") +
      '<div id="partybox">' + (countChecks() === CHECKS.length ? PARTY : "") + "</div>";
  }
  var VIEWS = [c0, c1, c2, c3, c4, c5, c6];

  /* ---------- Render ---------- */
  segs.innerHTML = CARDS.map(function () { return "<span><i></i></span>"; }).join("");
  function renderSound() { var b = $("sound"); b.setAttribute("aria-pressed", String(soundOn)); b.innerHTML = ic(soundOn ? "soundOn" : "soundOff") + (soundOn ? "Sonido" : "Sin sonido"); }
  function renderChrome() {
    var card = CARDS[state.i];
    document.documentElement.style.setProperty("--bg", card.bg);
    document.documentElement.style.setProperty("--fg", card.dark ? "#FFFFFF" : "#12224A");
    app.className = "app " + (card.dark ? "dark" : "light");
    Array.prototype.forEach.call(segs.children, function (s, i) { s.classList.toggle("on", i <= state.i); });
    $("where").textContent = "Paso " + (state.i + 1) + " de 7: " + card.name;
    var prev = $("prev"), next = $("next");
    prev.disabled = state.i === 0;
    prev.innerHTML = ic("arrowL") + "Atrás";
    if (state.i === 0) { next.disabled = !state.cat; next.innerHTML = state.cat ? "Siguiente" + ic("arrowR") : "Elige una opción"; }
    else if (state.i === 6) { next.disabled = false; next.innerHTML = "Volver al inicio"; }
    else { next.disabled = false; next.innerHTML = "Siguiente" + ic("arrowR"); }
  }
  var timers = [];
  /* from: desplazamiento de entrada en px (con signo); "still" = sin animación (teclado y carga inicial) */
  function render(from) {
    timers.forEach(clearTimeout); timers = [];
    renderChrome();
    var moving = typeof from === "number";
    stage.innerHTML = '<div class="card' + (moving ? " in" : " still") + '"' + (moving ? ' style="--from:' + from + 'px"' : "") + ">" + VIEWS[state.i]() + "</div>";
    stage.scrollTop = 0;
    if (!moving) return;
    if (state.i === 1) D1.slice(0, state.cat === "b" ? 3 : 2).forEach(function (d, i) { timers.push(setTimeout(function () { play("pop", [55, 58, 63][i]); }, d + 60)); });
    if (state.i === 5) D5.forEach(function (d, i) { timers.push(setTimeout(function () { play("pop", [58, 63, 67, 70][i]); }, d + 60)); });
  }
  var leaving = false;
  /* how: "btn" | "drag" | "key". Con teclado no se anima: se repite muchas veces y la animación lo haría sentir lento */
  function go(n, how, dx) {
    if (n < 0 || n > 6 || n === state.i || leaving) return;
    if (n > 0 && !state.cat) return;
    var fwd = n > state.i, sign = fwd ? 1 : -1;
    play(fwd ? "next" : "back");
    function swap() { leaving = false; state.i = n; render(how === "key" ? "still" : sign * (how === "drag" ? 56 : 32)); }
    var card = stage.firstElementChild;
    if (how === "key" || !card) { swap(); return; }
    leaving = true;
    var startX = how === "drag" ? (dx || 0) : 0;
    var endX = RM ? startX : -sign * (how === "drag" ? Math.max(140, Math.abs(startX) + 90) : 24);
    var a = anim(card, [{ opacity: card.style.opacity || 1, transform: "translateX(" + startX + "px)" }, { opacity: 0, transform: "translateX(" + endX + "px)" }], how === "drag" ? 170 : 120, { fill: "forwards" });
    if (a) a.onfinish = swap; else swap();
  }

  /* ---------- Hoja de detalle ---------- */
  var sheet = $("sheet"), inner = $("sheet-in"), scrim = $("scrim"), hd = $("sheet-hd");
  var lastFocus = null, sheetOpen = false, hideT = null;
  function openInfo(k) {
    var d = INFO[k]; if (!d) return; lastFocus = document.activeElement;
    $("sh-t").textContent = d[0]; $("sh-b").innerHTML = d[1]; $("sh-s").textContent = "Fuente: " + d[2];
    clearTimeout(hideT); sheet.removeAttribute("data-closing");
    inner.style.transform = ""; inner.style.transition = ""; scrim.style.opacity = ""; scrim.style.transition = "";
    scrim.hidden = false; sheet.hidden = false; inner.scrollTop = 0;
    void inner.offsetWidth;
    sheet.setAttribute("data-open", ""); scrim.setAttribute("data-open", ""); sheetOpen = true;
    try { $("sh-x").focus({ preventScroll: true }); } catch (e) {}
    play("open");
  }
  function closeInfo() {
    if (!sheetOpen) return; sheetOpen = false; play("close");
    sheet.setAttribute("data-closing", "");
    inner.style.transition = ""; inner.style.transform = ""; scrim.style.transition = ""; scrim.style.opacity = "";
    sheet.removeAttribute("data-open"); scrim.removeAttribute("data-open");
    hideT = setTimeout(function () {
      sheet.hidden = true; scrim.hidden = true; sheet.removeAttribute("data-closing");
      if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
    }, 260);
  }
  var sd = null;
  hd.addEventListener("pointerdown", function (e) {
    if (sd || !sheetOpen || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
    sd = { id: e.pointerId, y: e.clientY, t: performance.now(), dy: 0, h: inner.offsetHeight };
    try { hd.setPointerCapture(e.pointerId); } catch (x) {}
    inner.style.transition = "none"; scrim.style.transition = "none";
  });
  hd.addEventListener("pointermove", function (e) {
    if (!sd || e.pointerId !== sd.id) return;
    var dy = e.clientY - sd.y; sd.dy = dy;
    var y = dy >= 0 ? dy : -Math.pow(-dy, 0.6);
    inner.style.transform = "translateY(" + y.toFixed(1) + "px)";
    scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / sd.h));
  });
  function endSheetDrag(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var d = sd; sd = null;
    var v = d.dy / Math.max(1, performance.now() - d.t);
    inner.style.transition = ""; scrim.style.transition = "";
    if (e.type !== "pointercancel" && (d.dy > d.h * 0.25 || (v > 0.11 && d.dy > 12))) closeInfo();
    else { inner.style.transform = ""; scrim.style.opacity = ""; }
  }
  hd.addEventListener("pointerup", endSheetDrag);
  hd.addEventListener("pointercancel", endSheetDrag);

  /* ---------- Eventos ---------- */
  var autoT = null;
  document.addEventListener("touchstart", function () {}, { passive: true }); /* activa :active en iPhone */
  document.addEventListener("click", function (ev) {
    if (ev.target.id === "scrim") { closeInfo(); return; }
    var t = ev.target.closest("button"); if (!t) return;
    if (t.id === "sh-x") { closeInfo(); return; }
    if (t.id === "sound") { soundOn = !soundOn; store.set("mu7-sound", soundOn ? "on" : "off"); renderSound(); if (soundOn) play("on"); return; }
    if (t.id === "prev") { go(state.i - 1, "btn"); return; }
    if (t.id === "next") { if (state.i === 6) go(0, "btn"); else go(state.i + 1, "btn"); return; }
    if (t.dataset.info) { openInfo(t.dataset.info); return; }
    if (t.dataset.cat) {
      state.cat = t.dataset.cat; store.set("mu7-cat", state.cat); play("category");
      stage.querySelectorAll(".opt").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === state.cat)); });
      renderChrome();
      clearTimeout(autoT); autoT = setTimeout(function () { if (state.i === 0) go(1, "btn"); }, 520);
      return;
    }
    if (t.dataset.g) { if (state.g === t.dataset.g) return; state.g = t.dataset.g; updateTry("g"); return; }
    if (t.dataset.c) { if (state.c === t.dataset.c) return; state.c = t.dataset.c; updateTry("c"); return; }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!t.dataset || !t.dataset.k) return;
    state.checks[t.dataset.k] = t.checked;
    var count = countChecks(), all = count === CHECKS.length;
    if (t.checked && all) play("done"); else if (t.checked) play("tick", count); else play("untick");
    if (t.checked && !RM) anim(t.parentNode.querySelector(".box"), [{ transform: "scale(.82)" }, { transform: "scale(1.06)", offset: 0.6 }, { transform: "scale(1)" }], 300);
    var box = $("partybox"), cur = box.firstElementChild;
    if (all && (!cur || cur.dataset.leaving)) { box.innerHTML = PARTY; rise(box.firstElementChild); }
    else if (!all && cur && !cur.dataset.leaving) {
      cur.dataset.leaving = "1";
      var a = anim(cur, [{ opacity: 1 }, { opacity: 0 }], 150, { fill: "forwards" });
      var clear = function () { if (box.firstElementChild === cur) box.innerHTML = ""; };
      if (a) a.onfinish = clear; else clear();
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { closeInfo(); return; }
    if (sheetOpen) return;
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight") go(state.i + 1, "key");
    if (ev.key === "ArrowLeft") go(state.i - 1, "key");
  });

  /* ---------- Deslizar: la tarjeta sigue el dedo; un gesto rápido basta para pasar ---------- */
  var drag = null, suppressClick = false;
  function canGo(dx) { return dx < 0 ? (state.i < 6 && (state.i > 0 || !!state.cat)) : state.i > 0; }
  stage.addEventListener("pointerdown", function (e) {
    if (drag || leaving || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false, w: stage.clientWidth };
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      drag.on = true; drag.x += dx > 0 ? 10 : -10; drag.t = performance.now();
      try { stage.setPointerCapture(e.pointerId); } catch (x) {}
      drag.card = stage.firstElementChild; drag.card.classList.remove("in");
      dx = e.clientX - drag.x;
    }
    var can = canGo(dx);
    /* Si no hay tarjeta hacia ese lado, se mueve cada vez menos (amortiguado) */
    var x = can ? dx : (dx < 0 ? -1 : 1) * Math.pow(Math.abs(dx), 0.62);
    drag.dx = dx; drag.can = can; drag.x2 = x;
    drag.card.style.transform = "translateX(" + x.toFixed(1) + "px)";
    drag.card.style.opacity = can ? String(1 - Math.min(Math.abs(dx) / (drag.w * 1.6), 0.4)) : "";
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (!d.on) return;
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 80);
    var v = Math.abs(d.dx) / Math.max(1, performance.now() - d.t);
    var commit = d.can && e.type !== "pointercancel" && (Math.abs(d.dx) > d.w * 0.22 || (v > 0.11 && Math.abs(d.dx) > 24));
    if (commit) { go(state.i + (d.dx < 0 ? 1 : -1), "drag", d.x2); return; }
    var card = d.card, op = card.style.opacity || "1", tr = card.style.transform || "translateX(0px)";
    card.style.transform = ""; card.style.opacity = "";
    anim(card, [{ transform: tr, opacity: op }, { transform: "translateX(0px)", opacity: 1 }], 320);
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  /* Un arrastre no debe contar como toque (ni marcar una casilla por accidente) */
  stage.addEventListener("click", function (e) { if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; } }, true);

  renderSound();
  render("still");
})();
</script>
