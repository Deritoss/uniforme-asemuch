<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi uniforme 2026</title>
<meta name="theme-color" content="#F2C230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi uniforme">
<link rel="stylesheet" href="fonts/fonts.css">
<style>.homebtn{width:40px;height:40px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;color:inherit;flex:none;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(0.23,1,0.32,1)}.homebtn:active{transform:scale(.94)}.hwrap{display:flex;align-items:center;gap:8px;min-width:0}</style>
</head>
<body>
<style>
/* Estilo "taller de costura", fácil de seguir. Una sola apariencia clara, a propósito (papel, huincha, carretes).
   Gesto propio: la huincha de medir marca el paso; las etiquetas de ropa dan el veredicto.
   Movimiento: solo transform y opacity; curvas fuertes; lo que entra usa ease-out, lo que se desplaza en pantalla ease-in-out. */
:root {
  color-scheme: light;
  --ground: #E9EDF2;   /* lino frío */
  --paper: #FFFFFF;
  --ink: #1C2D4A;      /* azul marino tela */
  --muted: #3F4D63;
  --line: #B9C3D0;
  --tape: #F2C230;     /* huincha */
  --tapeDone: #E0AE1C;
  --kraft: #D9BE92;    /* etiqueta */
  --thread: #C2412D;   /* hilo rojo: la única señal de acento */
  --wood: #8A6A43;
  --okFg: #1E6B3F; --okBg: #DDF0E4;
  --warnFg: #7A4200; --warnBg: #F7E2B5;
  --badFg: #A3241C; --badBg: #F8D9D5;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --pendulum: cubic-bezier(0.45, 0, 0.55, 1);
  --lift: 0 1px 0 rgba(28, 45, 74, .05), 0 2px 6px -2px rgba(28, 45, 74, .16);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--tape); }
.wrap { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--cond); font-weight: 800; margin: 0; line-height: 1.02; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 9vw, 2.6rem); letter-spacing: -0.005em; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.35rem; }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
button {
  font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, color 200ms ease;
}
button:active { transform: scale(.97); }
.cat:active, .dunno:active, .btn:active, .nt:active { transform: scale(.985); }
:focus-visible { outline: 3px solid var(--thread); outline-offset: 3px; }
svg { display: block; }
.ico { width: 22px; height: 22px; flex: none; }

/* Huincha de medir: marca el paso y sirve para saltar entre pasos */
.tape { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--ground); }
.tape-in { max-width: 592px; margin: 0 auto; position: relative; height: 58px; overflow: hidden; }
.tape-bar { position: absolute; inset: 0 0 auto; height: 36px; background: var(--tape); overflow: hidden; box-shadow: 0 1px 0 rgba(28, 45, 74, .12); }
.tape-bar::before { content: ""; position: absolute; inset: 0 0 auto; height: 7px; background: repeating-linear-gradient(90deg, var(--ink) 0 1.2px, transparent 1.2px 12px); opacity: .85; z-index: 1; }
.tape-done { position: absolute; left: 0; top: 0; width: 100%; height: 36px; background: var(--tapeDone); transform-origin: left center; transition: transform 460ms var(--ease-in-out); }
.tape-nums { position: absolute; inset: 0 0 auto; height: 36px; display: grid; grid-template-columns: repeat(7, 1fr); z-index: 2; }
.tape-nums button { border: 0; background: transparent; position: relative; font-weight: 700; font-size: 13px; padding-top: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tape-nums button:active { transform: none; background: rgba(28, 45, 74, .1); }
.tape-nums button::before { content: ""; position: absolute; top: 0; left: 50%; width: 1.6px; height: 13px; background: var(--ink); }
.pin-track { position: absolute; inset: 0; pointer-events: none; z-index: 3; transition: transform 460ms var(--ease-in-out); }
.pin { position: absolute; left: 0; top: 3px; width: 28px; margin-left: -14px; display: flex; flex-direction: column; align-items: center; }
.pin b { width: 26px; height: 26px; border-radius: 50%; background: var(--thread); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.pin i { width: 2px; height: 12px; background: var(--thread); }
.pin i::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--thread); margin: 10px 0 0 -2px; }

/* Cabecera */
.top { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stepname { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.sound { display: inline-flex; align-items: center; gap: 6px; height: 44px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); padding: 0 14px 0 10px; font-size: 15px; font-weight: 600; flex: none; box-shadow: var(--lift); }
.sound[aria-pressed="false"] { color: var(--muted); box-shadow: none; background: transparent; }
.catrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.kraft { position: relative; display: inline-flex; align-items: center; background: var(--kraft); padding: 5px 14px 5px 24px; font-weight: 700; font-size: 14px; border-radius: 0 8px 8px 0; clip-path: polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%); }
.kraft::before { content: ""; position: absolute; left: 10px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--ground); }
.textbtn { border: 0; background: none; padding: 0 2px; min-height: 44px; font-weight: 700; font-size: 15px; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; display: inline-flex; align-items: center; gap: 6px; }

main { padding: 18px 0 24px; }
main:focus { outline: none; }
.panel { display: flex; flex-direction: column; gap: 20px; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.panel.enter > * { animation: enter 340ms var(--ease-out) both; }
.panel.enter > *:nth-child(2) { animation-delay: 40ms; } .panel.enter > *:nth-child(3) { animation-delay: 80ms; }
.panel.enter > *:nth-child(4) { animation-delay: 120ms; } .panel.enter > *:nth-child(5) { animation-delay: 160ms; }
.panel.enter > *:nth-child(n+6) { animation-delay: 200ms; }
.intro { display: flex; flex-direction: column; gap: 6px; }
.sec { display: flex; align-items: center; gap: 10px; }
.num { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 20px; flex: none; }
.card { background: var(--paper); border-radius: 16px; padding: 16px; box-shadow: var(--lift); }
.more { border: 0; background: none; padding: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; align-self: flex-start; }
.more:active { transform: scale(.98); }

/* Categorías */
.cat { width: 100%; text-align: left; border: 2px solid var(--ink); border-radius: 18px; background: var(--paper); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 0 var(--ink); }
.cat:active { box-shadow: 0 1px 0 var(--ink); }
.cat .hd { display: flex; align-items: center; gap: 14px; }
.cat .art { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.cat .art .ico { width: 32px; height: 32px; }
.cat.a .art { background: #DCE4F2; color: #1D4189; } .cat.b .art { background: #F4E6C4; color: #8A5A00; }
.cat .where { font-family: var(--cond); font-weight: 800; font-size: 1.55rem; line-height: 1.05; }
.cat .ex { color: var(--muted); font-size: 16px; }
.cat .ft { display: flex; justify-content: space-between; align-items: center; border-top: 1.5px dashed #CBD3DE; padding-top: 10px; font-size: 15px; }
.cat .go { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--thread); }
.cat .go .ico { transition: transform 200ms var(--ease-out); }
.dunno { height: 56px; border-radius: 14px; border: 2px dashed #8A99AD; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }

/* Prendas */
.g { display: block; }
.dye { transition: fill 320ms ease; }
.det { transition: stroke 320ms ease; }
.must { display: flex; flex-direction: column; gap: 10px; }
.mrow { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 16px; padding: 12px 14px; box-shadow: var(--lift); }
.mrow .g { width: 72px; height: 72px; flex: none; }
.mrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mrow .nm { font-family: var(--cond); font-weight: 800; font-size: 1.35rem; line-height: 1.05; }
.qty { font-family: var(--cond); font-weight: 800; font-size: 1rem; background: var(--ink); color: #fff; border-radius: 999px; padding: 1px 10px; align-self: flex-start; }
.dots { display: flex; gap: 4px; align-items: center; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #C7D0DB; }
.saldo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st { background: var(--paper); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 14px; line-height: 1.15; box-shadow: var(--lift); }
.st .g { width: 44px; height: 44px; }
.strip { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 12px 14px; background: var(--paper); box-shadow: var(--lift); }
.strip .bx { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: #DCE4F2; color: #1D4189; }
.strip > div { flex: 1; min-width: 0; font-size: 16px; display: flex; flex-direction: column; gap: 2px; }
.strip.warn, .strip.ok, .strip.bad { box-shadow: none; }
.strip.warn { background: var(--warnBg); } .strip.warn .bx { background: var(--warnFg); color: #fff; }
.strip.ok { background: var(--okBg); } .strip.ok .bx { background: var(--okFg); color: #fff; }
.strip.bad { background: var(--badBg); } .strip.bad .bx { background: var(--badFg); color: #fff; }

/* Parka */
.four { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.rung { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 10px 14px; }
.rung .pos { font-family: var(--cond); font-weight: 800; font-size: 1.6rem; width: 34px; text-align: center; flex: none; }
.rung.ok { background: var(--okBg); } .rung.ok .pos { color: var(--okFg); }
.rung.warn { background: var(--warnBg); } .rung.warn .pos { color: var(--warnFg); }
.rung.bad { background: var(--badBg); } .rung.bad .pos { color: var(--badFg); }
.rung .spools { display: flex; gap: 2px; flex: none; }
.yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--lift); }
.big[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* Etiqueta colgante (veredicto): cae la primera vez; si cambia, se balancea como péndulo */
.hang { display: flex; flex-direction: column; align-items: center; transform: rotate(7deg); transform-origin: top center; }
@keyframes drop {
  0% { opacity: 0; transform: translateY(-18px) rotate(-14deg); animation-timing-function: var(--ease-out); }
  45% { opacity: 1; transform: translateY(0) rotate(11deg); animation-timing-function: var(--pendulum); }
  75% { transform: rotate(5deg); animation-timing-function: var(--pendulum); }
  100% { transform: rotate(7deg); }
}
@keyframes sway {
  0% { transform: rotate(-5deg); animation-timing-function: var(--pendulum); }
  45% { transform: rotate(11deg); animation-timing-function: var(--pendulum); }
  75% { transform: rotate(5.5deg); animation-timing-function: var(--pendulum); }
  100% { transform: rotate(7deg); }
}
.hang.drop { animation: drop 560ms both; }
.hang.sway { animation: sway 460ms both; }
.hang .str { width: 2px; height: 26px; background: var(--ink); }
.tag { position: relative; padding: 18px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid currentColor; clip-path: polygon(50% 0, 100% 16px, 100% 100%, 0 100%, 0 16px); font-family: var(--cond); font-weight: 800; font-size: 21px; line-height: 1; }
.tag::before { content: ""; position: absolute; top: 8px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px currentColor; }
.tag.ok { background: var(--okBg); color: var(--okFg); } .tag.warn { background: var(--warnBg); color: var(--warnFg); } .tag.bad { background: var(--badBg); color: var(--badFg); }
/* Resultado: con una costura punteada, como una etiqueta cosida */
.res { display: flex; flex-direction: column; gap: 6px; border-radius: 14px; padding: 16px 18px; outline: 1.5px dashed rgba(28, 45, 74, .2); outline-offset: -7px; transition: background-color 240ms ease, outline-color 240ms ease; }
.res.ok { background: var(--okBg); outline-color: rgba(30, 107, 63, .4); }
.res.warn { background: var(--warnBg); outline-color: rgba(122, 66, 0, .35); }
.res.bad { background: var(--badBg); outline-color: rgba(163, 36, 28, .35); }
.res .what { font-size: 15px; font-weight: 600; }
.res h3 { font-size: 1.6rem; transition: color 240ms ease; }
.res.ok h3 { color: var(--okFg); } .res.warn h3 { color: var(--warnFg); } .res.bad h3 { color: var(--badFg); }

/* Probador */
.gpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gb { min-height: 62px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 16px; font-weight: 600; text-align: left; line-height: 1.15; box-shadow: var(--lift); }
.gb .gi { width: 38px; height: 38px; flex: none; }
.gb .gi path { fill: #fff; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; transition: stroke 200ms ease; }
.gb[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.gb[aria-pressed="true"] .gi path { stroke: #fff; }
.spoolgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px 4px; }
.sp { border: 0; background: none; border-radius: 14px; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); transition: transform 220ms var(--ease-out), background-color 200ms ease, box-shadow 200ms ease, color 200ms ease; }
.sp:active { transform: scale(.94); }
.sp[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 2.5px var(--thread), var(--lift); transform: translateY(-3px); }
.stage { position: relative; background: var(--paper); border-radius: 16px; height: 236px; display: flex; justify-content: center; align-items: flex-end; padding: 0 104px 10px 0; box-shadow: var(--lift); background-image: radial-gradient(120% 70% at 40% 100%, #F3F5F8 0, transparent 70%); }
.stage .rail { position: absolute; top: 14px; left: 16px; right: 16px; height: 6px; border-radius: 3px; background: var(--wood); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.stage .hanger { display: flex; flex-direction: column; align-items: center; }
.stage .g { width: 170px; height: 170px; margin-top: -16px; filter: drop-shadow(0 6px 6px rgba(28, 45, 74, .12)); }
.stage .hang { position: absolute; right: 18px; top: 20px; }
.stage .hint { position: absolute; right: 14px; top: 46px; width: 92px; text-align: center; font-size: 14px; color: var(--muted); }

/* No paga */
.nogrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.nt { position: relative; border: 0; background: var(--paper); border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 15px; font-weight: 600; line-height: 1.15; min-height: 62px; box-shadow: var(--lift); }
.nt .ico { width: 30px; height: 30px; color: var(--muted); }
.nt .ban { position: absolute; top: 6px; left: 30px; width: 18px; height: 18px; border-radius: 50%; background: var(--badFg); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--paper); }
.nt .ban .ico { width: 11px; height: 11px; color: #fff; }
.nt .ban .ico path { stroke-width: 3.2; }

/* Rendición */
.tl { display: flex; flex-direction: column; }
.tli { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 14px; }
.tli::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 0; border-left: 2px dashed var(--line); }
.tli:last-child::before { display: none; }
.tli .n { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 22px; flex: none; position: relative; z-index: 1; }
.tli .t { flex: 1; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
.tli .t b { font-size: 18px; }

/* Checklist: el visto se dibuja con un trazo; desmarcar es más rápido que marcar */
.checks { display: flex; flex-direction: column; gap: 8px; }
.ck { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 2px solid transparent; border-radius: 14px; padding: 12px 14px; cursor: pointer; font-size: 16px; box-shadow: var(--lift); -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color 200ms ease, border-color 200ms ease; }
.ck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck .box { width: 32px; height: 32px; border-radius: 9px; border: 2.5px solid var(--line); display: grid; place-items: center; color: #fff; flex: none; background: #fff; transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease; }
.ck:active .box { transform: scale(.9); }
.ck .box .ico path { stroke-width: 2.8; stroke-dasharray: 21; stroke-dashoffset: 21; transition: stroke-dashoffset 120ms ease; }
.ck:has(input:checked) { border-color: var(--okFg); background: var(--okBg); }
.ck:has(input:checked) .box { background: var(--okFg); border-color: var(--okFg); }
.ck:has(input:checked) .box .ico path { stroke-dashoffset: 0; transition: stroke-dashoffset 240ms var(--ease-out) 40ms; }
.ck:has(input:focus-visible) { outline: 3px solid var(--thread); outline-offset: 2px; }
.meter { display: flex; align-items: center; gap: 12px; }
.meter .trk { flex: 1; height: 14px; border-radius: 14px; background: var(--paper); overflow: hidden; box-shadow: inset 0 1px 2px rgba(28, 45, 74, .14); }
.meter .fill { width: 100%; height: 100%; background: var(--okFg); border-radius: 14px; transition: transform 420ms var(--ease-out); }
.meter b { font-family: var(--cond); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.done { display: flex; align-items: flex-start; gap: 16px; }

/* Navegación */
.nav { position: sticky; bottom: 0; z-index: 4; background: var(--ground); padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; border-top: 1px solid var(--line); box-shadow: 0 -12px 20px -16px rgba(28, 45, 74, .4); }
.btn { min-height: 58px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; padding: 0 16px; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--ink); color: #fff; flex: 1; box-shadow: 0 2px 0 #0E1A30; }
.btn .ico { transition: transform 200ms var(--ease-out); }
footer { padding-block: 18px 28px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

/* Hoja de detalle: entra con curva de cajón; sale más rápido; se puede bajar con el dedo */
.scrim { position: fixed; inset: 0; background: rgba(28, 45, 74, .45); z-index: 20; opacity: 0; transition: opacity 200ms ease; }
.scrim[data-open] { opacity: 1; transition-duration: 300ms; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; justify-content: center; pointer-events: none; }

      '<div class="ladder">' +
      '<div class="rung ok"><span class="pos">1°</span><span class="spools">' + spool(SW.azulmarino[1], 30) + '</span><div><b>Azul marino</b><br><span class="muted" style="font-size:15px">Siempre la primera opción</span></div></div>' +
      '<div class="rung warn"><span class="pos">2°</span><span class="spools">' + spool(SW.negro[1], 30) + spool(SW.cafe[1], 30) + '</span><div><b>Negro o café</b><br><span class="muted" style="font-size:15px">Solo si no hay azul marino</span></div></div>' +
      '<div class="rung bad"><span class="pos">' + ic("x") + '</span><div><b>Otros colores</b><br><span class="muted" style="font-size:15px">No sirven para esta prenda</span></div></div></div>' +
      sec(3, "¿Encontraste azul marino?") +
      '<div class="yesno"><button type="button" class="big" data-parka="si" aria-pressed="' + (state.parka === "si") + '">' + ic("check") + 'Sí, hay</button><button type="button" class="big" data-parka="no" aria-pressed="' + (state.parka === "no") + '">' + ic("x") + "No encontré</button></div>" +
      '<div id="parka-res" aria-live="polite">' + parkaRes() + "</div>" + more("parka26", "Ver el detalle de la excepción") + "</section>";
  }
  function curG() { return GARMENTS.filter(function (x) { return x.id === state.garment; })[0]; }
  function verdict() { return state.color ? curG().rule(state.color) : null; }
  function tryInner(g, r) { return '<span class="what">' + g.name(state.cat) + " en " + SW[state.color][0].toLowerCase() + "</span><h3>" + VERD[r[0]][2] + "</h3><p>" + r[1] + '</p><p class="muted" style="font-size:15px">Regla: ' + g.detail + "</p>"; }
  function v3() {
    var g = curG(), hex = state.color ? SW[state.color][1] : null, r = verdict();
    var gb = GARMENTS.map(function (x) { return '<button type="button" class="gb" data-garment="' + x.id + '" aria-pressed="' + (x.id === g.id) + '">' + silhouette(x.art) + "<span>" + x.name(state.cat) + "</span></button>"; }).join("");
    var sp = COLORS.map(function (k) { return '<button type="button" class="sp" data-color="' + k + '" aria-pressed="' + (state.color === k) + '">' + spool(SW[k][1]) + "<span>" + SW[k][0] + "</span></button>"; }).join("");
    var res = r ? '<div class="res ' + r[0] + '">' + tryInner(g, r) + "</div>" : '<div class="card muted">Elige un color en el paso 2 y aquí verás si sirve.</div>';
    return '<section class="panel">' + intro("Probador de colores", "Revisa si una prenda y un color sirven, antes de comprar. Son 3 pasos.") +
      sec(1, "¿Qué prenda vas a comprar?") + '<div class="gpick">' + gb + "</div>" +
      sec(2, "¿De qué color es?") + '<div class="spoolgrid">' + sp + "</div>" +
      sec(3, "Así queda") +
      '<div class="stage"><span class="rail"></span><div class="hanger"><svg viewBox="0 0 60 30" width="60" height="30" aria-hidden="true"><path d="M30 2 q7 0 7 6 q0 5 -7 7 v6 M30 21 L4 29 h52 Z" fill="none" stroke="#1C2D4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="gar">' + garment(g.art, hex) + "</span></div>" +
      '<div class="hang" id="hang"' + (r ? ' data-kind="' + r[0] + '">' + tagHtml(r[0]) : " hidden>") + "</div>" +
      '<span class="hint" id="hint"' + (r ? " hidden" : "") + ">Falta el color</span></div>" +
      '<div id="try-res" aria-live="polite">' + res + "</div>" +
      more("colores", "Ver cómo se usan los colores") + more("reglas", "Ver las reglas para todas las prendas") + "</section>";
  }
  /* El probador se actualiza en su lugar: así las transiciones (color, carrete, etiqueta) se pueden interrumpir sin saltos */
  function updateTry(changed) {
    var g = curG(), hex = state.color ? SW[state.color][1] : null, r = verdict(), kind = r ? r[0] : null;
    setPressed(".gb", "garment", state.garment);
    setPressed(".sp", "color", state.color);
    var gar = $("gar");
    if (changed === "garment") {
      gar.innerHTML = garment(g.art, hex);
      anim(gar.firstElementChild, RM ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: "translateY(6px) scale(.96)" }, { opacity: 1, transform: "none" }], 280);
    } else {
      gar.querySelectorAll(".dye").forEach(function (p) { p.setAttribute("fill", hex || "#FFFFFF"); });
      gar.querySelectorAll(".det").forEach(function (p) { p.setAttribute("stroke", detColor(hex)); });
    }
    var hang = $("hang"), hint = $("hint");
    if (!kind) { hang.hidden = true; hint.hidden = false; }
    else if (hang.hidden || hang.dataset.kind !== kind) {
      var first = hang.hidden;
      hang.innerHTML = tagHtml(kind); hang.dataset.kind = kind; hang.hidden = false; hint.hidden = true;
      hang.classList.remove("drop", "sway"); void hang.offsetWidth; hang.classList.add(first ? "drop" : "sway");
    }
    var box = $("try-res"), el = box.querySelector(".res");
    if (!kind) return;
    if (el) { el.className = "res " + kind; el.innerHTML = tryInner(g, r); morph(el); }
    else { box.innerHTML = '<div class="res ' + kind + '">' + tryInner(g, r) + "</div>"; rise(box.firstElementChild); }
  }
  function v4() {
    var items = [["interior", "underwear", "Ropa interior"], ["bano", "swim", "Traje de baño y ropa deportiva"], ["fiesta", "bowtie", "Ropa de fiesta"], ["bolso", "bag", "Carteras y mochilas"], ["perfume", "perfume", "Joyas y perfumes"], ["sandalia", "sandal", "Sandalias"], ["deportiva", "sneaker", "Zapatillas deportivas"], ["hogar", "plug", "Cosas del hogar"]];
    var tiles = items.map(function (i) { return '<button type="button" class="nt" data-no="' + i[0] + '" aria-label="' + i[2] + ': no se compra con la tarjeta. Ver detalle">' + ic(i[1]) + '<span class="ban">' + ic("x") + "</span><span>" + i[2] + "</span></button>"; }).join("");
    return '<section class="panel">' + intro("Lo que la tarjeta no paga", "Toca cada cosa para saber por qué.") +
      '<div class="nogrid">' + tiles + "</div>" +
      '<div class="strip ok"><span class="bx">' + ic("hanger") + '</span><div><b>Sí paga</b><span>Las prendas de tu lista, en colores institucionales y con boleta.</span></div></div>' +
      '<div class="strip"><span class="bx">' + ic("helmet") + '</span><div><b>Botas de seguridad, cascos y chalecos reflectantes</b><span>Son EPP: los entrega gratis la Municipalidad. Pídelos a tu jefatura.</span>' + more("epp") + "</div></div>" +
      '<div class="strip bad"><span class="bx">' + ic("cardX") + '</span><div><b>No la prestes ni la vendas</b><span>La tarjeta y las prendas son de la Municipalidad.</span>' + more("prohibido") + "</div></div></section>";
  }
  function v5() {
    var steps = [["boleta", "Compra con boleta", "Que diga qué prenda compraste."], ["formulario", "Llena el formulario", "Anotas cada prenda, su color y su valor."], ["visacion", "Tu jefatura lo visa", "Revisa que todo sea de tu categoría."], ["control", "Control lo revisa", "Te dice si quedó bien o si hay que corregir."]];
    var tl = steps.map(function (s, i) { return '<div class="tli"><span class="n">' + (i + 1) + '</span><div class="t"><b>' + s[1] + '</b><span class="muted">' + s[2] + "</span>" + more(s[0]) + "</div></div>"; }).join("");
    return '<section class="panel">' + intro("Después de comprar: la rendición", "Son 4 pasos, en este orden.") +
      '<div class="strip warn"><span class="bx">' + ic("calendar") + '</span><div><b>¿Hasta cuándo?</b><span>La fecha la fija la Dirección de Control: mínimo 60 días desde que recibes la tarjeta.</span>' + more("plazo") + "</div></div>" +
      '<div class="tl">' + tl + "</div>" +
      sec("?", "Si algo queda mal") +
      '<div class="strip warn"><span class="bx">' + ic("clock") + '</span><div><b>Tienes 10 días hábiles para corregir</b><span>Si no corriges, devuelves el monto.</span>' + more("observaciones") + "</div></div>" +
      '<div class="strip"><span class="bx">' + ic("lost") + '</span><div><b>¿Perdiste la tarjeta?</b><span>Avisa de inmediato a Recursos Humanos.</span>' + more("robo") + "</div></div></section>";
  }
  function checkItems() {
    var c = state.cat;
    return [
      ["min", c === "a" ? "Compré la parka y el zapato o zapatilla" : "Compré la parka, el zapato o zapatilla y el pantalón outdoor"],
      ["parka", "La parka es azul marino, o negra o café porque no había"],
      ["sup", "La camisa o polera de todos los días es azul o celeste"],
      ["logos", "Ninguna prenda tiene marcas o estampados grandes"],
      ["zap", "Si es zapatilla: outdoor y sin logos deportivos llamativos"],
      ["jeans", "Si son jeans: azul o negro liso, sin rasgaduras"],
      ["excl", "No compré ropa interior, deportiva, de fiesta ni EPP"],
      ["dist", "Tengo el pin o una prenda con el logo municipal"],
      ["boleta", "Pedí boleta con el detalle de cada prenda"]
    ];
  }
  function countDone() { var items = checkItems(); return [items.filter(function (i) { return state.checks[state.cat + i[0]]; }).length, items.length]; }
  function doneHtml(animate) { return '<div class="done"><div class="hang' + (animate ? " drop" : "") + '">' + tagHtml("ok", "Listo") + '</div><div class="res ok" style="flex:1"><h3>Listo para pagar</h3><p>Guarda la boleta para la rendición.</p></div></div>'; }
  function meterX(d, n) { return "translateX(" + (d / n * 100 - 100).toFixed(2) + "%)"; }
  function v6() {
    var items = checkItems(), c = countDone();
    return '<section class="panel">' + intro("Antes de pagar en la caja", "Marca cada punto. Queda guardado en este teléfono.") +
      '<div class="meter"><div class="trk"><div class="fill" id="mfill" style="transform:' + meterX(c[0], c[1]) + '"></div></div><b id="mcount" aria-live="polite">' + c[0] + " de " + c[1] + "</b></div>" +
      '<div class="checks">' + items.map(function (i) {
        var id = "ck-" + state.cat + "-" + i[0];
        return '<label class="ck" for="' + id + '"><input type="checkbox" id="' + id + '" data-check="' + i[0] + '"' + (state.checks[state.cat + i[0]] ? " checked" : "") + '><span class="box">' + ic("check") + "</span><span>" + i[1] + "</span></label>";
      }).join("") + "</div>" +
      '<div id="donebox">' + (c[0] === c[1] ? doneHtml(false) : "") + "</div>" +
      '<button type="button" class="textbtn" id="reset" style="align-self:flex-start">Desmarcar todo</button></section>';
  }
  function updateChecks(input) {
    var c = countDone(), all = c[0] === c[1];
    $("mfill").style.transform = meterX(c[0], c[1]);
    $("mcount").textContent = c[0] + " de " + c[1];
    var box = $("donebox"), cur = box.firstElementChild;
    if (all && (!cur || cur.dataset.leaving)) { box.innerHTML = doneHtml(true); rise(box.querySelector(".res")); }
    else if (!all && cur && !cur.dataset.leaving) { cur.dataset.leaving = "1"; fadeOut(cur, function () { if (box.firstElementChild === cur) box.innerHTML = ""; }); }
    if (input && input.checked && !RM) anim(input.parentNode.querySelector(".box"), [{ transform: "scale(.82)" }, { transform: "scale(1.06)", offset: 0.6 }, { transform: "scale(1)" }], 300);
  }
  var VIEWS = [v0, v1, v2, v3, v4, v5, v6];

  /* ---------- Render ---------- */
  function renderSound() {
    var b = $("sound");
    b.setAttribute("aria-pressed", String(soundOn));
    b.innerHTML = ic(soundOn ? "soundOn" : "soundOff") + (soundOn ? "Sonido" : "Sin sonido");
  }
  function renderChrome() {
    var has = !!state.cat;
    $("tape").hidden = !has;
    $("catrow").hidden = !has;
    $("nav").hidden = !has || state.step === 0;
    $("stepname").textContent = has ? "Paso " + (state.step + 1) + " de 7: " + STEPS[state.step] : "Mi uniforme 2026";
    if (!has) return;
    var c = CAT[state.cat];
    $("catrow").innerHTML = '<span class="kraft">' + c.short + " " + c.long + '</span><button type="button" class="textbtn" id="changecat">Cambiar categoría</button>';
    var pct = (state.step + 0.5) / 7 * 100;
    $("pintrack").style.transform = "translateX(" + pct.toFixed(2) + "%)";
    $("tapedone").style.transform = "scaleX(" + (pct / 100).toFixed(4) + ")";
    $("pinnum").textContent = state.step + 1;
    $("tapenums").innerHTML = STEPS.map(function (s, i) {
      return '<button type="button" data-step="' + i + '" aria-label="Ir al paso ' + (i + 1) + ": " + s + '"' + (i === state.step ? ' aria-current="step" style="color:transparent"' : "") + ">" + (i + 1) + "</button>";
    }).join("");
    $("nav").innerHTML = '<button type="button" class="btn" data-go="-1">' + ic("arrowL") + "Volver</button>" +
      (state.step < 6 ? '<button type="button" class="btn primary" data-go="1">Siguiente: ' + STEPS[state.step + 1] + ic("arrowR") + "</button>" : '<button type="button" class="btn primary" data-step="0">' + ic("undo") + "Volver al inicio</button>");
  }
  function render(stepChanged) {
    if (!state.cat) state.step = 0;
    main.innerHTML = VIEWS[state.step]();
    if (stepChanged && main.firstElementChild) main.firstElementChild.classList.add("enter");
    renderChrome();
    if (stepChanged) {
      try { main.focus({ preventScroll: true }); } catch (e) {}
      window.scrollTo(0, 0);
    }
  }
  function go(i) {
    var n = Math.max(0, Math.min(6, i));
    if (n === state.step) return;
    play(n > state.step ? "next" : "back");
    state.step = n; render(true);
  }

  /* ---------- Hoja de detalle: se abre, se cierra y se puede arrastrar hacia abajo ---------- */
  var sheet = $("sheet"), inner = $("sheet-in"), scrim = $("scrim"), hd = $("sheet-hd");
  var lastFocus = null, sheetOpen = false, hideT = null;
  function openInfo(k) {
    var d = INFO[k]; if (!d) return;
    lastFocus = document.activeElement;
    $("sheet-t").textContent = d[0];
    $("sheet-b").innerHTML = d[1];
    $("sheet-s").textContent = "Fuente: " + d[2];
    clearTimeout(hideT);
    sheet.removeAttribute("data-closing");
    inner.style.transform = ""; inner.style.transition = ""; scrim.style.opacity = ""; scrim.style.transition = "";
    scrim.hidden = false; sheet.hidden = false; inner.scrollTop = 0;
    void inner.offsetWidth;
    sheet.setAttribute("data-open", ""); scrim.setAttribute("data-open", "");
    sheetOpen = true; document.documentElement.style.overflow = "hidden";
    try { $("sheet-x").focus({ preventScroll: true }); } catch (e) {}
    play("open");
  }
  function closeInfo() {
    if (!sheetOpen) return;
    sheetOpen = false; play("close");
    sheet.setAttribute("data-closing", "");
    inner.style.transition = ""; inner.style.transform = ""; scrim.style.transition = ""; scrim.style.opacity = "";
    sheet.removeAttribute("data-open"); scrim.removeAttribute("data-open");
    document.documentElement.style.overflow = "";
    hideT = setTimeout(function () {
      sheet.hidden = true; scrim.hidden = true; sheet.removeAttribute("data-closing");
      if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
    }, 260);
  }
  var sd = null;
  hd.addEventListener("pointerdown", function (e) {
    if (sd || !sheetOpen || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
    sd = { id: e.pointerId, y: e.clientY, t: performance.now(), dy: 0, h: inner.offsetHeight };
    try { hd.setPointerCapture(e.pointerId); } catch (x) {}
    inner.style.transition = "none"; scrim.style.transition = "none";
  });
  hd.addEventListener("pointermove", function (e) {
    if (!sd || e.pointerId !== sd.id) return;
    var dy = e.clientY - sd.y; sd.dy = dy;
    /* Hacia arriba no hay tope duro: cuesta cada vez más (fricción) */
    var y = dy >= 0 ? dy : -Math.pow(-dy, 0.6);
    inner.style.transform = "translateY(" + y.toFixed(1) + "px)";
    scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / sd.h));
  });
  function endSheetDrag(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var d = sd; sd = null;
    var v = d.dy / Math.max(1, performance.now() - d.t);
    inner.style.transition = ""; scrim.style.transition = "";
    /* Basta un gesto rápido hacia abajo, aunque sea corto */
    if (e.type !== "pointercancel" && (d.dy > d.h * 0.25 || (v > 0.11 && d.dy > 12))) closeInfo();
    else { inner.style.transform = ""; scrim.style.opacity = ""; }
  }
  hd.addEventListener("pointerup", endSheetDrag);
  hd.addEventListener("pointercancel", endSheetDrag);

  /* ---------- Eventos ---------- */
  document.addEventListener("touchstart", function () {}, { passive: true }); /* activa :active en iPhone */
  document.addEventListener("click", function (ev) {
    if (ev.target.id === "scrim") { closeInfo(); return; }
    var t = ev.target.closest("button"); if (!t) return;
    if (t.id === "sheet-x") { closeInfo(); return; }
    if (t.id === "sound") { soundOn = !soundOn; store.set("mu26-sound", soundOn ? "on" : "off"); renderSound(); if (soundOn) play("on"); return; }
    if (t.dataset.info) { openInfo(t.dataset.info); return; }
    if (t.dataset.no) { var nk = t.dataset.no; play("bad"); setTimeout(function () { openInfo(nk); }, 140); return; }
    if (t.dataset.cat) { state.cat = t.dataset.cat; store.set("mu26-cat", state.cat); state.color = null; state.parka = null; play("category"); state.step = 1; render(true); return; }
    if (t.id === "changecat") { go(0); return; }
    if (t.dataset.step) { go(Number(t.dataset.step)); return; }
    if (t.dataset.go) { go(state.step + Number(t.dataset.go)); return; }
    if (t.dataset.parka) {
      if (state.parka === t.dataset.parka) return;
      var had = !!state.parka; state.parka = t.dataset.parka;
      setPressed(".big", "parka", state.parka);
      play(state.parka === "si" ? "ok" : "warn");
      var box = $("parka-res"); box.innerHTML = parkaRes();
      if (had) morph(box.firstElementChild); else rise(box.firstElementChild);
      return;
    }
    if (t.dataset.garment) {
      if (state.garment === t.dataset.garment) return;
      state.garment = t.dataset.garment;
      var r1 = verdict(); play(r1 ? r1[0] : "tap");
      updateTry("garment"); return;
    }
    if (t.dataset.color) {
      if (state.color === t.dataset.color) return;
      state.color = t.dataset.color;
      play(verdict()[0]);
      updateTry("color"); return;
    }
    if (t.id === "reset") {
      checkItems().forEach(function (i) { delete state.checks[state.cat + i[0]]; });
      store.set("mu26-checks", JSON.stringify(state.checks));
      main.querySelectorAll("input[data-check]").forEach(function (x) { x.checked = false; });
      play("back"); updateChecks(null);
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!t.dataset || !t.dataset.check) return;
    state.checks[state.cat + t.dataset.check] = t.checked;
    store.set("mu26-checks", JSON.stringify(state.checks));
    var c = countDone();
    if (t.checked && c[0] === c[1]) play("done"); else if (t.checked) play("tick", c[0]); else play("untick");
    updateChecks(t);
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeInfo(); });

  renderSound();
  render(false);
})();
</script>

<script>if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
